openapi: 3.0.3
info:
  title: SCREAMER API
  description: API для самой громкой социальной сети.
  version: 1.0.0
servers:
  - url: http://localhost:8084/api
    description: Local Dev Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- MODEL: POST ---
    Post:
      type: object
      properties:
        id:
          type: integer
          example: 42
        content:
          type: string
          example: "ПОЧЕМУ КОФЕ ТАКОЙ ГОРЯЧИЙ?!"
        initial_volume:
          type: integer
          minimum: 0
          maximum: 120
          description: Громкость при создании (влияет на размер шрифта).
        support_score:
          type: integer
          example: 1500
          description: Сумма всей громкости, которую наорали другие юзеры (аналог лайков/кармы).
        max_scream_volume:
          type: integer
          example: 110
          description: Самый громкий крик, зафиксированный на этом посте (для рекордов).
        created_at:
          type: string
          format: date-time
    
    # --- REQUEST: CREATE POST ---
    CreatePostRequest:
      type: object
      required:
        - content
        - initial_volume
      properties:
        content:
          type: string
          minLength: 1
          example: "Всем привет!"
        initial_volume:
          type: integer
          description: Средняя громкость голоса
          example: 45

    # --- REQUEST: LOGIN ---
    LoginRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          example: "MAD_MAX"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1Ni..."

    # --- WEBSOCKET EVENTS ---
    ScreamSupportEvent:
      type: object
      description: "Front -> Back: Юзер орет на пост"
      properties:
        action:
          type: string
          enum: [scream_support]
        post_id:
          type: integer
        volume:
          type: integer
          description: Текущая громкость крика (0-120)

    SupportUpdateEvent:
      type: object
      description: "Back -> Front: Обновляем счетчик поддержки у всех"
      properties:
        event:
          type: string
          enum: [support_update]
        post_id:
          type: integer
        new_support_score:
          type: integer
        is_shaking:
          type: boolean
          description: Флаг для фронта (если score резко вырос - трясем экран)

# --- PATHS ---
paths:
  /auth/login:
    post:
      summary: Вход / Регистрация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /posts:
    get:
      summary: Получить ленту постов
      description: Сортировка - новые сверху. (Можно добавить ?sort=loudest для сортировки по support_score)
      responses:
        '200':
          description: Список постов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      summary: Создать новый пост
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string

  /stats/leaderboard:
    get:
      summary: Топ крикунов
      responses:
        '200':
          description: Лидерборд
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    max_volume:
                      type: integer

  /ws:
    get:
      summary: WebSocket Connection
      description: |
        Realtime обмен криками.
        Client -> Server: ScreamSupportEvent
        Server -> Client: SupportUpdateEvent
      responses:
        '101':
          description: Switching Protocols
